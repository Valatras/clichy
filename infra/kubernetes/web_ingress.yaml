
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clichy-web
  namespace: clichy-dev
spec:
  ingressClassName: traefik
  rules:
    - host: clichy.localhost
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: clichy-server
                port:
                  number: 3000
          - path: /photos
            pathType: Prefix
            backend:
              service:
                name: clichy-server
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clichy-web
                port:
                  number: 80
