apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clichy-server
  labels:
    release: prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - clichy-dev
      - clichy-test
  selector:
    matchLabels:
      app: clichy-server
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
