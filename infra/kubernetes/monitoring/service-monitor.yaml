apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clichy-server
  labels:
    # Must match the Prometheus CR's serviceMonitorSelector in the Helm release.
    release: prometheus-stack
spec:
  # Scrape both environments; these are namespace names, not Pod selectors.
  namespaceSelector:
    matchNames:
      - clichy-dev
      - clichy-test
  # Within each namespace, discover Services with this label. The Service's
  # named "http" port routes to the Server container on port 3000.
  selector:
    matchLabels:
      app: clichy-server
  endpoints:
    - port: http
      # Fastify exposes application metrics here; Prometheus pulls this URL.
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
