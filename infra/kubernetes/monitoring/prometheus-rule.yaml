apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: clichy-alerts
  labels:
    # Prometheus selects this rule using the same release label as the
    # ServiceMonitor; this does not configure metric scraping.
    release: prometheus-stack
spec:
  groups:
    - name: clichy.workloads
      rules:
        - alert: ClichyPostgresReplicaDisconnected
          expr: cnpg_pg_replication_is_wal_receiver_up == 0 and on (namespace, pod) cnpg_pg_replication_in_recovery == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: PostgreSQL replica is not receiving WAL
            description: "CNPG replica {{ $labels.namespace }}/{{ $labels.pod }} has no active WAL receiver."
        - alert: ClichyPostgresReplicationLagHigh
          expr: cnpg_pg_replication_lag > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: PostgreSQL replica lag is high
            description: "CNPG replica {{ $labels.namespace }}/{{ $labels.pod }} reports {{ $value }} seconds of replication lag."
        # These rules evaluate metrics already scraped by kube-state-metrics,
        # kubelet/cAdvisor, and the Kubernetes API; they do not collect metrics.
        - alert: ClichyPodRestarting
          expr: |
            sum by (namespace, pod, container) (
              increase(kube_pod_container_status_restarts_total{
                namespace=~"clichy-(dev|test|prod)"
              }[15m])
            ) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Clichy container is repeatedly restarting
            description: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} restarted more than three times in 15 minutes."
        - alert: ClichyDeploymentUnavailable
          expr: |
            kube_deployment_status_replicas_unavailable{
              namespace=~"clichy-(dev|test|prod)"
            } > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Clichy Deployment has unavailable replicas
            description: "{{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} unavailable replicas."
        - alert: ClichyPodImageOrCrashBackoff
          expr: |
            kube_pod_container_status_waiting_reason{
              namespace=~"clichy-(dev|test|prod)",
              reason=~"CrashLoopBackOff|ImagePullBackOff"
            } == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Clichy pod is stuck waiting
            description: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} is in {{ $labels.reason }}."
        - alert: ClichyHighCPUUtilization
          expr: |
            sum by (namespace, pod, container) (
              rate(container_cpu_usage_seconds_total{
                namespace=~"clichy-(dev|test|prod)",
                container!="",
                container!="POD"
              }[5m])
            )
            /
            on (namespace, pod, container)
            kube_pod_container_resource_requests{
              namespace=~"clichy-(dev|test|prod)",
              resource="cpu",
              unit="core"
            } > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Clichy container CPU remains high
            description: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has used more than 85% of its CPU request for 15 minutes."
        - alert: ClichyHighMemoryUtilization
          expr: |
            container_memory_working_set_bytes{
              namespace=~"clichy-(dev|test|prod)",
              container!="",
              container!="POD"
            }
            /
            on (namespace, pod, container)
            kube_pod_container_resource_limits{
              namespace=~"clichy-(dev|test|prod)",
              resource="memory",
              unit="byte"
            } > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Clichy container memory remains high
            description: "{{ $labels.namespace }}/{{ $labels.pod }} container {{ $labels.container }} has used more than 85% of its memory limit for 15 minutes."
        - alert: ClichyPVCNearCapacity
          expr: |
            kubelet_volume_stats_available_bytes{
              namespace=~"clichy-(dev|test|prod)"
            }
            /
            kubelet_volume_stats_capacity_bytes{
              namespace=~"clichy-(dev|test|prod)"
            } < 0.15
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Clichy persistent volume is nearly full
            description: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has less than 15% free capacity."
        - alert: ClichyHPAMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{
              namespace="clichy-test",
              horizontalpodautoscaler=~"clichy-(web|server)"
            }
            >=
            kube_horizontalpodautoscaler_spec_max_replicas{
              namespace="clichy-test",
              horizontalpodautoscaler=~"clichy-(web|server)"
            }
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Clichy HPA has reached its replica ceiling
            description: "HPA {{ $labels.horizontalpodautoscaler }} in clichy-test has remained at its maximum replica count for 10 minutes."
        - alert: ClichyPhotoQueueBacklogHigh
          expr: sum by (namespace) (clichy_photo_queue_jobs{state="waiting",namespace=~"clichy-(dev|test|prod)"}) > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Clichy photo queue has a sustained backlog
            description: "The photo queue in {{ $labels.namespace }} has {{ $value }} waiting jobs for at least 10 minutes."
        - alert: ClichyPhotoOutboxBacklogHigh
          expr: clichy_photo_outbox_unpublished_events{namespace=~"clichy-(dev|test|prod)"} > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Clichy photo outbox has a sustained backlog
            description: "The database outbox in {{ $labels.namespace }} has {{ $value }} unpublished events for at least 10 minutes."
        - alert: ClichyWorkerMetricsUnavailable
          expr: up{namespace=~"clichy-(dev|test|prod)",pod=~"clichy-worker-.*"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Clichy worker metrics scrape is failing
            description: "Prometheus cannot scrape worker metrics from {{ $labels.namespace }}/{{ $labels.pod }}."
        - alert: ClichyOutboxMetricsUnavailable
          expr: clichy_photo_outbox_metrics_available{namespace=~"clichy-(dev|test|prod)"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Clichy cannot query outbox health
            description: "The API in {{ $labels.namespace }} cannot currently read outbox counts from PostgreSQL."
