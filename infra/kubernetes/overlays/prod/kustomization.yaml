apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clichy-prod
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: clichy-server-config
    literals:
      - NODE_ENV=production
      - BETTER_AUTH_URL=https://clichy.example.com
      - CORS_ORIGIN=https://clichy.example.com
      - PHOTO_STORAGE_PATH=/data/photos
  - name: clichy-web-config
    literals:
      - NODE_ENV=production
images:
  - name: clichy-server
    newTag: prod
  - name: clichy-web
    newTag: prod
replicas:
  - name: clichy-server
    count: 1
  - name: clichy-web
    count: 2
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: clichy-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: clichy.example.com
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: clichy-web
    patch: |-
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - clichy.example.com
            secretName: clichy-prod-tls
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: clichy-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: clichy-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: clichy-postgres
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 50Gi
