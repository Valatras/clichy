apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: clichy-prod-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  # Retained for the legacy PostgreSQL StatefulSet until CNPG migration is verified.
  name: clichy-prod-postgres
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: clichy-prod-local
  local:
    path: /srv/clichy/k3s-storage/prod/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - valtask
  claimRef:
    namespace: clichy-prod
    name: data-clichy-postgres-0
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: clichy-prod-postgres-1
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: clichy-prod-local
  local:
    path: /srv/clichy/k3s-storage/prod/postgres-cnpg-1
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [valtask]
  claimRef:
    namespace: clichy-prod
    name: clichy-postgres-1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: clichy-prod-postgres-2
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: clichy-prod-local
  local:
    path: /srv/clichy/k3s-storage/prod/postgres-cnpg-2
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [valtask]
  claimRef:
    namespace: clichy-prod
    name: clichy-postgres-2
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: clichy-prod-photos
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: clichy-prod-local
  local:
    path: /srv/clichy/k3s-storage/prod/photos
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - valtask
  claimRef:
    namespace: clichy-prod
    name: clichy-server-photos
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: clichy-prod-redis
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: clichy-prod-local
  local:
    path: /srv/clichy/k3s-storage/prod/redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - valtask
  claimRef:
    namespace: clichy-prod
    name: clichy-redis-data
