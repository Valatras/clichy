apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clichy-prod
resources:
  - ../../../cnpg
  - storage.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: clichy-postgres
    patch: |-
      - op: replace
        path: /spec/bootstrap/initdb/database
        value: clichy_prod
      - op: replace
        path: /spec/storage/storageClass
        value: clichy-prod-local
