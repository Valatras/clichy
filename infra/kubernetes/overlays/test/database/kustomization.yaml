apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clichy-test
resources:
  - ../../../cnpg
patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: clichy-postgres
    patch: |-
      - op: replace
        path: /spec/bootstrap/initdb/database
        value: clichy_test
      - op: replace
        path: /spec/storage/size
        value: 2Gi
