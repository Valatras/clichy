apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clichy-test
resources:
  - namespace.yaml
  - ../../base
  - hpa.yaml
configMapGenerator:
  - name: clichy-server-config
    literals:
      - NODE_ENV=production
      - BETTER_AUTH_URL=http://valtask
      - CORS_ORIGIN=http://valtask
      - PHOTO_STORAGE_PATH=/data/photos
  - name: clichy-web-config
    literals:
      - NODE_ENV=production
images:
  - name: clichy-server
    newTag: test
  - name: clichy-web
    newTag: test
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: clichy-server
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 2000
          supplementalGroups:
            - 1000
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: clichy-server
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull-secret
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: clichy-web
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull-secret
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: clichy-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: valtask
      - op: add
        path: /spec/rules/-
        value:
          host: valtask.xyz
          http:
            paths:
              - path: /api/auth
                pathType: Prefix
                backend:
                  service:
                    name: clichy-server
                    port:
                      number: 3000
              - path: /photos
                pathType: Prefix
                backend:
                  service:
                    name: clichy-server
                    port:
                      number: 3000
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: clichy-web
                    port:
                      number: 80
      - op: add
        path: /spec/rules/-
        value:
          host: www.valtask.xyz
          http:
            paths:
              - path: /api/auth
                pathType: Prefix
                backend:
                  service:
                    name: clichy-server
                    port:
                      number: 3000
              - path: /photos
                pathType: Prefix
                backend:
                  service:
                    name: clichy-server
                    port:
                      number: 3000
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: clichy-web
                    port:
                      number: 80
