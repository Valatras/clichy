apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clichy-test
resources:
  - namespace.yaml
  - ../../base
configMapGenerator:
  - name: clichy-server-config
    literals:
      - NODE_ENV=production
      - BETTER_AUTH_URL=http://clichy-test.localhost
      - CORS_ORIGIN=http://clichy-test.localhost
      - PHOTO_STORAGE_PATH=/data/photos
  - name: clichy-web-config
    literals:
      - NODE_ENV=production
images:
  - name: clichy-server
    newTag: test
  - name: clichy-web
    newTag: test
replicas:
  - name: clichy-server
    count: 1
  - name: clichy-web
    count: 1
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: clichy-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: clichy-test.localhost
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: clichy-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: clichy-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
