apiVersion: v1
kind: PersistentVolume
metadata:
  name: clichy-photos-test
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: clichy-test
    name: clichy-server-photos-nfs
  nfs:
    server: 100.108.232.50
    path: /srv/cloud-data/clichy/photos
    readOnly: false
