apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clichy-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clichy-server
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: clichy-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: clichy-web
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
