apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: clichy-postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: clichy
      owner: clichy
      secret:
        name: clichy-postgres-app
  storage:
    storageClass: local-path
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  minSyncReplicas: 0
  maxSyncReplicas: 0
