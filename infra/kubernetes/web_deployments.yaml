
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clichy-web
  namespace: clichy-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clichy-web
  template:
    metadata:
      labels:
        app: clichy-web
    spec:
      containers:
        - name: web
          image: clichy-web:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: clichy-web-config
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: clichy-web
  namespace: clichy-dev
spec:
  selector:
    app: clichy-web
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
