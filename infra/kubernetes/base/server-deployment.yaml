apiVersion: apps/v1
kind: Deployment
metadata:
  name: clichy-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clichy-server
  template:
    metadata:
      labels:
        app: clichy-server
    spec:
      containers:
        - name: server
          image: clichy-server:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: clichy-server-config
          env:
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: clichy-server-secrets
                  key: BETTER_AUTH_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clichy-server-secrets
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: photos
              mountPath: /data/photos
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: clichy-server-photos
