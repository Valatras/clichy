apiVersion: apps/v1
kind: Deployment
metadata:
  name: clichy-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clichy-web
  template:
    metadata:
      labels:
        app: clichy-web
    spec:
      containers:
        - name: web
          image: clichy-web:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: clichy-web-config
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
