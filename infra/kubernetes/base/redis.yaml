apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clichy-redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clichy-redis
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: clichy-redis
  template:
    metadata:
      labels:
        app: clichy-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clichy-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: clichy-redis
spec:
  selector:
    app: clichy-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  type: ClusterIP
