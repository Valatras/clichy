apiVersion: apps/v1
kind: Deployment
metadata:
  name: clichy-worker
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: clichy-worker
  template:
    metadata:
      labels:
        app: clichy-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: clichy-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: clichy-server-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clichy-server-secrets
                  key: DATABASE_URL
          ports:
            - name: health
              containerPort: 3001
              protocol: TCP
          volumeMounts:
            - name: photos
              mountPath: /data/photos
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 768Mi
      volumes:
        - name: photos
          persistentVolumeClaim:
            claimName: clichy-server-photos
