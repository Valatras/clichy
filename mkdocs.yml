site_name: Clichy Documentation
site_description: Engineering and operations guide for the Clichy photo library service
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - assets/mermaid-init.js
repo_name: valatras/clichy
repo_url: https://github.com/valatras/clichy
edit_uri: edit/master/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - Project:
      - Overview: project/overview.md
      - Requirements traceability: project/requirements.md
      - Roadmap and status: project/roadmap.md
      - Glossary: project/glossary.md
  - Architecture:
      - System overview: architecture/overview.md
      - Application: architecture/application.md
      - Networking: architecture/networking.md
      - Asynchronous processing: architecture/asynchronous-processing.md
  - Development:
      - Onboarding: development/onboarding.md
      - Prerequisites and configuration: development/prerequisites.md
      - Local development: development/local-development.md
      - Project structure: development/project-structure.md
      - Testing: development/testing.md
  - Infrastructure:
      - Cluster setup: infrastructure/cluster-setup.md
      - Kubernetes environments: infrastructure/kubernetes.md
      - Namespaces and traffic: infrastructure/namespaces.md
      - Storage: infrastructure/storage.md
      - CI/CD: infrastructure/ci-cd.md
      - Monitoring and scaling: infrastructure/monitoring.md
      - Cloud migration plan: infrastructure/cloud-migration.md
  - Database:
      - PostgreSQL and Prisma: database/overview.md
      - Schema and migrations: database/migrations.md
      - Replication: database/replication.md
      - Sharding: database/sharding.md
      - Backup and restore: database/backup-restore.md
  - Operations:
      - Démo professeur: operations/demo.md
      - Healthchecks: operations/healthchecks.md
      - Maintenance audit: operations/maintenance-audit.md
      - Deployment runbook: operations/deployment.md
      - Troubleshooting: operations/troubleshooting.md
      - Known issues and resolved incidents: operations/known-issues.md
  - Design:
      - Brand guidelines: design/brand-guidelines.md
  - Decisions:
      - ADR index: decisions/index.md
      - Kubernetes and environments: decisions/0001-kubernetes.md
      - PostgreSQL and Prisma: decisions/0002-postgres-prisma.md
      - Redis and BullMQ: decisions/0003-redis-bullmq.md
      - Citus experiment: decisions/0004-citus-experiment.md
      - Traefik ingress: decisions/0005-traefik.md
      - Environment isolation: decisions/0006-environment-isolation.md
      - Database scaling gap: decisions/0007-replication-sharding.md
      - Zero-downtime status: decisions/0008-zero-downtime.md
copyright: Clichy project documentation
extra:
  generator: false
