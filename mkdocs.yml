site_name: Clichy Documentation
site_description: Engineering and operations guide for the Clichy photo library service
extra_javascript:
  - https://unpkg.com/mermaid@11.17.2/dist/mermaid.min.js
  - assets/mermaid-init.js
repo_name: valatras/clichy
repo_url: https://github.com/valatras/clichy
edit_uri: edit/master/docs/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep orange
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Getting Started:
      - Clichy: index.md
      - Local setup: development/onboarding.md
      - Testing: development/testing.md
  - Architecture:
      - Overview: architecture/overview.md
      - Application and photo flow: architecture/application.md
      - Networking: architecture/networking.md
  - Infrastructure:
      - Kubernetes and environments: infrastructure/kubernetes.md
      - CI/CD: infrastructure/ci-cd.md
      - Databases: infrastructure/databases.md
      - Redis, monitoring and scaling: infrastructure/monitoring.md
  - Operations:
      - Démo professeur: operations/demo.md
      - Deployment and migrations: operations/deployment.md
      - Scripts & Commands: operations/scripts.md
      - Troubleshooting: operations/troubleshooting.md
  - Glossary: glossary.md
  - Decisions:
      - Index: decisions/index.md
      - Kubernetes: decisions/0001-kubernetes.md
      - PostgreSQL and Prisma: decisions/0002-postgres-prisma.md
      - Redis and BullMQ: decisions/0003-redis-bullmq.md
      - Historical Citus experiment: decisions/0004-citus-experiment.md
      - Traefik: decisions/0005-traefik.md
      - Environment isolation: decisions/0006-environment-isolation.md
      - Replication and sharding: decisions/0007-replication-sharding.md
      - Zero-downtime evidence: decisions/0008-zero-downtime.md
      - Unified Citus and CNPG: decisions/0009-unified-citus-cnpg.md
copyright: Clichy project documentation
extra:
  generator: false
