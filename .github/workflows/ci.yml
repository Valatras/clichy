name: Clichy CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clichy?schema=public
          VITE_SERVER_URL: http://localhost:3000

      - name: Run server tests
        run: pnpm --filter server test

      - name: Build applications
        run: pnpm build
