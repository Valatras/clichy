name: Clichy CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clichy?schema=public
          VITE_SERVER_URL: http://localhost:3000

      - name: Run server tests
        run: pnpm --filter server test

      - name: Build applications
        run: pnpm build
        env:
          VITE_SERVER_URL: http://localhost:3000

  package:
    name: Build and publish container images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker_clichy_server/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ghcr.io/valatras/clichy-server:sha-${{ github.sha }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker_clichy_web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ghcr.io/valatras/clichy-web:sha-${{ github.sha }}
          build-args: |
            VITE_SERVER_URL=http://localhost:3000

  deploy-test:
    name: Deploy to Test on valtask
    runs-on: [self-hosted, linux]
    needs: [ci, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: clichy-test-deployment
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install database workspace dependencies
        run: pnpm install --frozen-lockfile --filter @clichy/db...

      - name: Verify the valtask cluster
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            printf 'Refusing to deploy: checked out %s, expected %s\n' \
              "$checked_out_sha" "$GITHUB_SHA" >&2
            exit 1
          fi
          node_names="$(kubectl get nodes \
            --output=jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')"
          if [[ "$node_names" != "valtask" ]]; then
            printf 'Refusing to deploy Test: expected the single node valtask, got:\n%s\n' \
              "$node_names" >&2
            exit 1
          fi

      - name: Prepare Test monitoring and deployment metadata
        run: |
          set -euo pipefail
          kubectl apply -k infra/kubernetes/monitoring
          for app in server web; do
            deployment="clichy-${app}"
            manifest="infra/kubernetes/base/${app}-deployment.yaml"
            if [ -n "$(kubectl get deployment "${deployment}" \
              --namespace=clichy-test \
              --ignore-not-found \
              --output=name)" ]; then
              kubectl apply set-last-applied \
                --filename="${manifest}" \
                --namespace=clichy-test \
                --create-annotation=true
            fi
          done

      - name: Apply Test migrations and deploy the checked-out SHA
        run: |
          CLICHY_DEPLOY_CONFIRM=yes \
            ./infra/kubernetes/scripts/deploy.sh test "sha-${GITHUB_SHA}"

      - name: Show deployment and pod status
        if: always()
        run: kubectl get deployments,pods,pvc,ingress --namespace=clichy-test --output=wide

  deploy-prod:
    name: Deploy to Production on valtask
    runs-on: [self-hosted, linux]
    needs: [ci, package, deploy-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: production
    concurrency:
      group: clichy-prod-deployment
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify the checked-out deployment commit
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            printf 'Refusing to deploy: checked out %s, expected %s\n' \
              "$checked_out_sha" "$GITHUB_SHA" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install database workspace dependencies
        run: pnpm install --frozen-lockfile --filter @clichy/db...

      - name: Apply Production migrations and deploy the checked-out SHA
        run: |
          CLICHY_DEPLOY_CONFIRM=yes \
            ./infra/kubernetes/scripts/deploy.sh prod "sha-${GITHUB_SHA}"

      - name: Show Production deployment status
        if: always()
        run: kubectl get deployments,pods,pvc,ingress --namespace=clichy-prod --output=wide
