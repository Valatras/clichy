name: Clichy CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm check-types
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clichy?schema=public
          VITE_SERVER_URL: http://localhost:3000

      - name: Run server tests
        run: pnpm --filter server test

      - name: Build applications
        run: pnpm build
        env:
          VITE_SERVER_URL: http://localhost:3000

  package:
    name: Build and publish container images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker_clichy_server/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ghcr.io/valatras/clichy-server:sha-${{ github.sha }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker_clichy_web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ghcr.io/valatras/clichy-web:sha-${{ github.sha }}
          build-args: |
            VITE_SERVER_URL=http://localhost:3000

  deploy:
    name: Deploy to local Kubernetes
    runs-on: [self-hosted, linux]
    needs: [ci, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install database workspace dependencies
        run: pnpm install --frozen-lockfile --filter @clichy/db...

      - name: Apply database migrations to Test
        # Migrate before deploying code that may require the new schema.
        run: |
          set -euo pipefail
          kubectl port-forward --address 127.0.0.1 \
            --namespace=clichy-test \
            service/clichy-postgres 25433:5432 \
            >"${RUNNER_TEMP}/clichy-test-postgres-port-forward.log" 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/25433) >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! (echo > /dev/tcp/127.0.0.1/25433) >/dev/null 2>&1; then
            cat "${RUNNER_TEMP}/clichy-test-postgres-port-forward.log"
            exit 1
          fi

          DATABASE_URL="$(kubectl get secret clichy-server-secrets \
            --namespace=clichy-test \
            --output=json |
            node -e '
              let input = "";
              process.stdin.on("data", (chunk) => input += chunk);
              process.stdin.on("end", () => {
                const secret = JSON.parse(input);
                const url = new URL(
                  Buffer.from(secret.data.DATABASE_URL, "base64").toString(),
                );
                url.hostname = "127.0.0.1";
                url.port = "25433";
                process.stdout.write(url.toString());
              });
            ')"
          export DATABASE_URL
          pnpm --filter @clichy/db exec prisma migrate deploy

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k infra/kubernetes/monitoring
          for app in server web; do
            deployment="clichy-${app}"
            manifest="infra/kubernetes/base/${app}-deployment.yaml"
            if [ -n "$(kubectl get deployment "${deployment}" \
              --namespace=clichy-test \
              --ignore-not-found \
              --output=name)" ]; then
              kubectl apply set-last-applied \
                --filename="${manifest}" \
                --namespace=clichy-test \
                --create-annotation=true
            fi
          done
          kubectl apply -k infra/kubernetes/overlays/test

      - name: Update workloads to the published images
        run: |
          kubectl set image deployment/clichy-server \
            server=ghcr.io/valatras/clichy-server:sha-${GITHUB_SHA} \
            --namespace=clichy-test
          kubectl set image deployment/clichy-web \
            web=ghcr.io/valatras/clichy-web:sha-${GITHUB_SHA} \
            --namespace=clichy-test

      - name: Wait for deployments to roll out
        run: |
          kubectl rollout status deployment/clichy-server --namespace=clichy-test --timeout=180s
          kubectl rollout status deployment/clichy-web --namespace=clichy-test --timeout=180s


      - name: Show deployment and pod status
        if: always()
        run: kubectl get deployments,pods --namespace=clichy-test --output=wide
